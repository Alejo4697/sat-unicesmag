<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradientes Institucionales UNICESMAG -->
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#002855"/>
    </linearGradient>
    <linearGradient id="redCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6192E"/>
      <stop offset="100%" stop-color="#7B1120"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1C40F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B7950B"/>
    </linearGradient>
    <!-- Trayectoria circular para el texto -->
    <path id="textPathTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none"/>
    <path id="textPathBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>

  <!-- Anillo Exterior Dorado -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#goldRing)" stroke-width="4"/>

  <!-- Anillo Azul Institucional (Bordura) -->
  <circle cx="100" cy="100" r="86" fill="url(#blueRing)" stroke="url(#goldRing)" stroke-width="2"/>

  <!-- Texto Circular Institucional -->
  <text font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="12.5" fill="#FFFFFF" letter-spacing="2.8">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      UNIVERSIDAD CESMAG
    </textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="8.5" fill="#F1C40F" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      PASTO • COLOMBIA
    </textPath>
  </text>

  <!-- Anillo Interior Blanco y Dorado -->
  <circle cx="100" cy="100" r="62" fill="#FFFFFF" stroke="url(#goldRing)" stroke-width="3"/>

  <!-- Núcleo Central Rojo Franciscano -->
  <circle cx="100" cy="100" r="54" fill="url(#redCenter)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Cruz Central y Resplandor -->
  <path d="M 100 52 V 148" stroke="url(#goldRing)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 72 82 H 128" stroke="url(#goldRing)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Brazos Cruzados Franciscanos (Brazo de Cristo y San Francisco con Estigmas) -->
  <path d="M 72 122 Q 100 88 128 78" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 128 122 Q 100 88 72 78" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Llagas / Estigmas de Amor Franciscano (Puntos Rojos en Manos) -->
  <circle cx="72" cy="78" r="2.5" fill="#F1C40F"/>
  <circle cx="128" cy="78" r="2.5" fill="#F1C40F"/>

  <!-- Libro Abierto de la Ciencia -->
  <path d="M 82 134 Q 100 130 100 138 Q 100 130 118 134 L 116 144 Q 100 140 100 148 Q 100 140 84 144 Z" fill="#FFFFFF" stroke="#001F3F" stroke-width="1"/>

  <!-- Antorcha Encendida de la Cultura y Saber -->
  <path d="M 97 68 L 103 68 L 101 76 L 99 76 Z" fill="url(#goldRing)"/>
  <path d="M 100 56 Q 106 63 100 68 Q 94 63 100 56 Z" fill="#F1C40F"/>
</svg>
